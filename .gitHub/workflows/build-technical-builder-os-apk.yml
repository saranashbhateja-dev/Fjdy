name: Build Technical Builder OS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect app directory
        shell: bash
        run: |
          set -e
          echo "Repository contents:"
          ls -la

          if [ -f "package.json" ] && [ -f "index.html" ]; then
            APP_DIR="."
          elif [ -f "technical-builder-os/package.json" ]; then
            APP_DIR="technical-builder-os"
          elif [ -f "Technical Builder OS/package.json" ]; then
            APP_DIR="Technical Builder OS"
          else
            FOUND="$(find . -maxdepth 4 -type f -name package.json \
              ! -path '*/node_modules/*' -print -quit)"

            if [ -z "$FOUND" ]; then
              echo "ERROR: Could not find package.json."
              find . -maxdepth 4 -type f | sort
              exit 1
            fi

            APP_DIR="$(dirname "$FOUND")"
          fi

          echo "Detected app directory: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Check environment
        shell: bash
        run: |
          echo "APP_DIR=$APP_DIR"
          node --version
          npm --version
          java -version
          sdkmanager --version

      - name: Install Builder OS dependencies
        shell: bash
        run: |
          set -e
          cd "$APP_DIR"

          test -f package.json
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f curriculum.json

          npm install --no-audit --no-fund

      - name: Validate JavaScript
        shell: bash
        run: |
          set -e
          cd "$APP_DIR"
          node --check app.js
          node --check server.js

      - name: Prepare Capacitor web bundle
        shell: bash
        run: |
          set -e
          cd "$APP_DIR"

          rm -rf www
          mkdir -p www

          cp index.html www/index.html
          cp app.js www/app.js
          cp styles.css www/styles.css
          cp curriculum.json www/curriculum.json

          echo "Files inside www:"
          find www -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Configure Capacitor
        shell: bash
        run: |
          cd "$APP_DIR"

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.saransh.technicalbuilderos",
            "appName": "Technical Builder OS",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Create Android project
        shell: bash
        run: |
          set -e
          cd "$APP_DIR"

          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android project already exists."
          fi

      - name: Sync Capacitor
        shell: bash
        run: |
          set -e
          cd "$APP_DIR"
          npx cap sync android

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$APP_DIR/android"

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="$APP_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            find "$APP_DIR/android" -type f \
              \( -name "*.apk" -o -name "*.aab" \) -print || true
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Technical-Builder-OS-debug-apk
          path: "${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
